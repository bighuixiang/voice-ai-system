<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #16213e; }
      .subtitle { font: 400 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #526072; }
      .lane-title { font: 700 24px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1d2433; }
      .node-title { font: 700 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #182033; }
      .node-text { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #475569; }
      .legend { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .shared { fill: #eef4ff; stroke: #3867d6; stroke-width: 2; }
      .game { fill: #eaf7f1; stroke: #2e8b57; stroke-width: 2; }
      .direct { fill: #fff3e6; stroke: #c77800; stroke-width: 2; }
      .ops { fill: #f4f0ff; stroke: #725ac1; stroke-width: 2; }
      .warn { fill: #fff0f0; stroke: #d64545; stroke-width: 2; }
      .lane-game { fill: #f6fcf9; stroke: #b9dfca; stroke-width: 2; }
      .lane-direct { fill: #fffaf2; stroke: #f0c987; stroke-width: 2; }
      .lane-shared { fill: #f7f9fe; stroke: #c7d7ff; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-game { fill: none; stroke: #2e8b57; stroke-width: 2.4; marker-end: url(#arrow-game); }
      .line-direct { fill: none; stroke: #c77800; stroke-width: 2.4; marker-end: url(#arrow-direct); }
      .line-warn { fill: none; stroke: #d64545; stroke-width: 2.2; marker-end: url(#arrow-warn); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-game" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="arrow-direct" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c77800"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1220" fill="#ffffff"/>
  <text x="72" y="64" class="title">企业文化日 H5 抽奖流程对比图</text>
  <text x="72" y="98" class="subtitle">对比“小游戏达标后抽奖”和“直接抽奖”两种方案。共用规则：4 个抽奖时段、每轮最多 1 次、全活动每人最多中奖 1 次、允许 4 轮均未中奖。</text>

  <rect x="60" y="128" width="1720" height="188" rx="10" class="lane-shared"/>
  <text x="86" y="166" class="lane-title">共用入口与身份校验</text>

  <rect x="92" y="190" width="200" height="72" rx="8" class="shared"/>
  <text x="192" y="218" text-anchor="middle" class="node-title">员工打开 H5</text>
  <text x="192" y="242" text-anchor="middle" class="node-text">进入活动首页或登录页</text>

  <rect x="350" y="190" width="220" height="72" rx="8" class="shared"/>
  <text x="460" y="218" text-anchor="middle" class="node-title">手机号登录</text>
  <text x="460" y="242" text-anchor="middle" class="node-text">绑定唯一员工身份</text>

  <path d="M720 190 L840 226 L720 262 L600 226 Z" class="shared"/>
  <text x="720" y="221" text-anchor="middle" class="node-title">名单校验</text>
  <text x="720" y="243" text-anchor="middle" class="node-text">是否可参与</text>

  <rect x="880" y="190" width="230" height="72" rx="8" class="shared"/>
  <text x="995" y="218" text-anchor="middle" class="node-title">进入活动首页</text>
  <text x="995" y="242" text-anchor="middle" class="node-text">展示轮次与个人状态</text>

  <path d="M1260 190 L1390 226 L1260 262 L1130 226 Z" class="shared"/>
  <text x="1260" y="221" text-anchor="middle" class="node-title">当前有开放轮次</text>
  <text x="1260" y="243" text-anchor="middle" class="node-text">4 个时间段之一</text>

  <rect x="1470" y="190" width="210" height="72" rx="8" class="warn"/>
  <text x="1575" y="218" text-anchor="middle" class="node-title">暂无开放轮次</text>
  <text x="1575" y="242" text-anchor="middle" class="node-text">展示下一轮时间</text>

  <path class="line" d="M292 226 H350"/>
  <path class="line" d="M570 226 H600"/>
  <path class="line" d="M840 226 H880"/>
  <path class="line" d="M1110 226 H1130"/>
  <path class="line-warn" d="M1390 226 H1470"/>
  <text x="1428" y="212" text-anchor="middle" class="small">否</text>

  <rect x="60" y="348" width="820" height="462" rx="10" class="lane-game"/>
  <text x="86" y="386" class="lane-title">方案 A：小游戏达标后抽奖</text>
  <text x="86" y="414" class="subtitle">员工必须完成当轮小游戏，并达到积分门槛或完成条件，才获得本轮抽奖资格。</text>

  <rect x="102" y="456" width="210" height="76" rx="8" class="game"/>
  <text x="207" y="485" text-anchor="middle" class="node-title">进入当轮小游戏</text>
  <text x="207" y="509" text-anchor="middle" class="node-text">按轮次展示玩法/素材</text>

  <rect x="392" y="456" width="210" height="76" rx="8" class="game"/>
  <text x="497" y="485" text-anchor="middle" class="node-title">完成小游戏</text>
  <text x="497" y="509" text-anchor="middle" class="node-text">生成当轮成绩</text>

  <path d="M740 448 L860 494 L740 540 L620 494 Z" class="game"/>
  <text x="740" y="489" text-anchor="middle" class="node-title">是否达标</text>
  <text x="740" y="513" text-anchor="middle" class="node-text">积分/任务门槛</text>

  <rect x="392" y="610" width="220" height="76" rx="8" class="warn"/>
  <text x="502" y="639" text-anchor="middle" class="node-title">未达标</text>
  <text x="502" y="663" text-anchor="middle" class="node-text">提示可按规则再挑战</text>

  <rect x="102" y="610" width="230" height="76" rx="8" class="game"/>
  <text x="217" y="639" text-anchor="middle" class="node-title">获得本轮资格</text>
  <text x="217" y="663" text-anchor="middle" class="node-text">进入抽奖页前置条件</text>

  <path class="line-game" d="M312 494 H392"/>
  <path class="line-game" d="M602 494 H620"/>
  <path class="line-warn" d="M740 540 V648 H612"/>
  <text x="764" y="578" class="small">否</text>
  <path class="line-game" d="M598 648 H332"/>
  <path class="line-game dash" d="M392 648 H207 V532"/>
  <text x="666" y="482" class="small">是</text>

  <rect x="940" y="348" width="720" height="462" rx="10" class="lane-direct"/>
  <text x="966" y="386" class="lane-title">方案 B：直接抽奖</text>
  <text x="966" y="414" class="subtitle">员工完成登录并处于当轮开放时间内，即可进入当轮抽奖页，流程更短，运营后台也可更轻。</text>

  <rect x="994" y="456" width="240" height="76" rx="8" class="direct"/>
  <text x="1114" y="485" text-anchor="middle" class="node-title">开放时间内登录</text>
  <text x="1114" y="509" text-anchor="middle" class="node-text">无需小游戏门槛</text>

  <rect x="1320" y="456" width="240" height="76" rx="8" class="direct"/>
  <text x="1440" y="485" text-anchor="middle" class="node-title">获得本轮入口</text>
  <text x="1440" y="509" text-anchor="middle" class="node-text">每轮最多抽 1 次</text>

  <rect x="994" y="610" width="560" height="92" rx="8" class="direct"/>
  <text x="1274" y="644" text-anchor="middle" class="node-title">直接抽奖方案减少的节点</text>
  <text x="1274" y="670" text-anchor="middle" class="node-text">不需要小游戏配置、积分门槛、成绩记录、达标人数统计</text>

  <path class="line-direct" d="M1234 494 H1320"/>

  <rect x="60" y="846" width="1720" height="334" rx="10" class="lane-shared"/>
  <text x="86" y="884" class="lane-title">共用抽奖、结果与运营支撑</text>

  <rect x="100" y="936" width="250" height="82" rx="8" class="shared"/>
  <text x="225" y="967" text-anchor="middle" class="node-title">服务端二次校验</text>
  <text x="225" y="991" text-anchor="middle" class="node-text">时间/本轮已抽/已中奖</text>

  <path d="M500 929 L640 977 L500 1025 L360 977 Z" class="shared"/>
  <text x="500" y="972" text-anchor="middle" class="node-title">满足抽奖条件</text>
  <text x="500" y="996" text-anchor="middle" class="node-text">含库存与排重</text>

  <rect x="720" y="936" width="240" height="82" rx="8" class="shared"/>
  <text x="840" y="967" text-anchor="middle" class="node-title">点击抽奖</text>
  <text x="840" y="991" text-anchor="middle" class="node-text">写入本轮抽奖记录</text>

  <path d="M1120 929 L1260 977 L1120 1025 L980 977 Z" class="shared"/>
  <text x="1120" y="972" text-anchor="middle" class="node-title">抽奖结果</text>
  <text x="1120" y="996" text-anchor="middle" class="node-text">中奖或未中奖</text>

  <rect x="1370" y="904" width="250" height="82" rx="8" class="ops"/>
  <text x="1495" y="935" text-anchor="middle" class="node-title">中奖</text>
  <text x="1495" y="959" text-anchor="middle" class="node-text">生成奖品与领奖记录</text>

  <rect x="1370" y="1032" width="250" height="82" rx="8" class="shared"/>
  <text x="1495" y="1063" text-anchor="middle" class="node-title">未中奖</text>
  <text x="1495" y="1087" text-anchor="middle" class="node-text">可等待下一轮，允许 0 次中奖</text>

  <rect x="100" y="1060" width="250" height="82" rx="8" class="warn"/>
  <text x="225" y="1091" text-anchor="middle" class="node-title">不满足条件</text>
  <text x="225" y="1115" text-anchor="middle" class="node-text">展示原因并返回首页</text>

  <rect x="1660" y="904" width="100" height="210" rx="8" class="ops"/>
  <text x="1710" y="943" text-anchor="middle" class="node-title">后台</text>
  <text x="1710" y="974" text-anchor="middle" class="small">名单</text>
  <text x="1710" y="1002" text-anchor="middle" class="small">轮次</text>
  <text x="1710" y="1030" text-anchor="middle" class="small">奖品</text>
  <text x="1710" y="1058" text-anchor="middle" class="small">排重</text>
  <text x="1710" y="1086" text-anchor="middle" class="small">导出/核销</text>

  <path class="line-game" d="M217 686 V772 H225 V936"/>
  <path class="line-direct" d="M1440 532 V772 H225 V936"/>
  <path class="line" d="M350 977 H360"/>
  <path class="line-warn" d="M500 1025 V1101 H350"/>
  <text x="522" y="1049" class="small">否</text>
  <path class="line" d="M640 977 H720"/>
  <text x="660" y="963" class="small">是</text>
  <path class="line" d="M960 977 H980"/>
  <path class="line" d="M1260 977 H1370"/>
  <path class="line" d="M1260 977 C1324 977 1324 1073 1370 1073"/>
  <path class="line" d="M1620 945 H1660"/>
  <path class="line" d="M1620 1073 H1660"/>

  <rect x="72" y="1160" width="22" height="14" rx="3" class="game"/>
  <text x="104" y="1173" class="legend">小游戏方案独有</text>
  <rect x="246" y="1160" width="22" height="14" rx="3" class="direct"/>
  <text x="278" y="1173" class="legend">直接抽奖方案独有</text>
  <rect x="450" y="1160" width="22" height="14" rx="3" class="shared"/>
  <text x="482" y="1173" class="legend">两种方案共用</text>
  <rect x="624" y="1160" width="22" height="14" rx="3" class="ops"/>
  <text x="656" y="1173" class="legend">后台/运营支撑</text>
</svg>
