version: '3.8'

# Production optimized configuration
services:
  api-service:
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      DEBUG: false
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  ai-service:
    environment:
      DEBUG: false
      MAX_CONCURRENT_TASKS: 1
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1.5G
          cpus: '0.75'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  nginx:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
          cpus: '0.05'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s