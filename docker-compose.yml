version: '3.8'

services:
  # NestJS API Service
  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    container_name: voice-ai-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AI_SERVICE_URL: http://ai-service:8000
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-50MB}
      UPLOAD_PATH: /app/uploads
      KNOWLEDGE_PATH: /app/knowledge
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Performance optimizations
      NODE_OPTIONS: "--max-old-space-size=512"
      UV_THREADPOOL_SIZE: 4
    volumes:
      - uploads_data:/app/uploads
      - knowledge_data:/app/knowledge
      - api_logs:/app/logs
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - voice-ai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Python AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: voice-ai-python
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2-1.5B-Instruct}
      DEVICE: ${DEVICE:-cpu}
      VECTOR_DB_PATH: /app/vector_db
      VECTOR_DB_COLLECTION: knowledge_base
      MAX_AUDIO_SIZE: ${MAX_AUDIO_SIZE:-52428800}
      SUPPORTED_AUDIO_FORMATS: '["wav", "mp3", "m4a", "flac"]'
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-2}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-300}
      # Performance optimizations
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - vector_db_data:/app/vector_db
      - models_data:/app/models
      - ai_logs:/app/logs
      - ai_temp:/app/temp
    networks:
      - voice-ai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${AI_MEMORY_LIMIT:-4G}
          cpus: ${AI_CPU_LIMIT:-2.0}
        reservations:
          memory: ${AI_MEMORY_RESERVATION:-2G}
          cpus: ${AI_CPU_RESERVATION:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: voice-ai-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - voice-ai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  models_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./models
  vector_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./ai-service/vector_db
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./api/uploads
  knowledge_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./api/knowledge
  api_logs:
    driver: local
  ai_logs:
    driver: local
  ai_temp:
    driver: local
  nginx_logs:
    driver: local

networks:
  voice-ai-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: voice-ai-br0
    ipam:
      config:
        - subnet: 172.20.0.0/16